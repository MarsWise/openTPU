# A small openTPU in NanGate45 for fast flow iterations, and the shape of a shuttle-sized die
# (docs/asic.md): 32-deep MXU x 2 columns, 4 lanes, 64 KiB TMEM, 1 K instructions.

[target]
name = "nangate45-small"
kind = "asic"
platform_id = 257
description = "NanGate45 ASIC, a small architecture (D=32, MCOLS=2, 4 lanes)"

[arch]
S = 1
D = 32
MCOLS = 2
ACT_BLOCKS = 32
ACT_ROWS = 0
TMEM_WORDS = 16384
IMEM_WORDS = 8192
DRAM_BYTES = 268435456
LANES = 4
PAIR = false
TPAIR = false                    # TMM PAIR, the ternary K-split by two (CAPS2 bit1): production builds before it lack it
TQUAD = false                    # TMM QUAD, the ternary K-split by four (CAPS2 bit2, QACT DUP4): not in production builds yet
TFN = false                      # VOP table functions (CAPS2 bit3)
TGSC = false                     # native ternary group scales (CAPS2 bit4)
VCMP = false                     # compare/select (CAPS2 bit5)
TBIN = false                     # packed binary weights (CAPS2 bit6)
TBGSC = false                    # binary group scales (CAPS2 bit7)
VU8 = false                      # packed unsigned byte conversion (CAPS2 bit8)
TGRQ = false                     # TMM GSC block-major layout (CAPS2 bit9)
VRAND = false                     # VOP RAND, counter-based uniforms (CAPS2 bit10)
TCQ = false                       # TMM CQ, codebook LUT weights (CAPS2 bit11)
TATAN = false                     # TFN atan on [0, 1] (table 8) (CAPS2 bit12)
QST4 = false                      # QST Q4, 4-bit ROW rows (CAPS2 bit13)
LDX = false                       # LDX indexed row gather (CAPS2 bit14)
TD5 = false                       # TMM T5 dense trits (CAPS2 bit15)
VBFLY = false                     # VOP BFLY, the Hadamard butterfly stage (CAPS2 bit16)
VAFF = false                      # VOP AFF, the fused row/column affine (CAPS2 bit17)
QST6 = false                      # QST Q6, 6-bit ROW rows as nibble and 2-bit planes (CAPS2 bit18)
DSTEP = false
STREAM = false
SEQ_WC = false                  # the sequencer's wait entries (WAITC, EXPERIMENTAL: docs/seq_vpu.md):
#                                 the host loads them with every program; needs WIN <= 16

[uarch]
MXU_IMPL = 2
MXU_CL = 16
VPU_CL = 1
ULANES = 4
TMEM_IMPL = 1
RPB = 1
WPB = 1
WIN = 16
FIFO_DEPTH = 64
TRACE_DEPTH = 0
PQ_WIN = 1024
CHASH = false

[tech]
family = "asic"
pdk = "nangate45"
vendor = "open"

[platform]
board = "asic"
core_mhz = 400.0
mem = "port"
channels_per_slice = 1
channel_bytes = 268435456
beat_bytes = 16
host = "port"
