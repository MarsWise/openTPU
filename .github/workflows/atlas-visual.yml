name: Atlas browser acceptance

on:
  push:
    branches: [docs/opentpu-atlas-v2]
    paths:
      - 'docs/silicon-explorer/**'
      - '.github/workflows/atlas-visual.yml'
  workflow_dispatch:

jobs:
  chromium:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium browser runtime
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual HTML in Chromium
        run: node docs/silicon-explorer/visual.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-chromium-screenshots
          path: docs/silicon-explorer/visual-artifacts/
          retention-days: 14
